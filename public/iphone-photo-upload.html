<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Foto Upload (1000x1000, max 300 KB)</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }
    body {
      margin: 0;
      padding: 16px;
      background: #f5f5f7;
      color: #1f2937;
    }
    .card {
      max-width: 560px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
    }
    h1 {
      margin: 0 0 12px;
      font-size: 1.25rem;
    }
    p {
      margin: 8px 0;
      line-height: 1.4;
    }
    .row {
      margin-top: 12px;
      display: grid;
      gap: 8px;
    }
    input[type="file"], button {
      width: 100%;
      font-size: 1rem;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #d1d5db;
      box-sizing: border-box;
    }
    button {
      background: #2563eb;
      color: #ffffff;
      border: none;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }
    img {
      width: 100%;
      border-radius: 10px;
      margin-top: 8px;
      border: 1px solid #e5e7eb;
      background: #f9fafb;
    }
    .hint {
      font-size: 0.9rem;
      color: #4b5563;
    }
    .ok {
      color: #065f46;
      font-weight: 600;
    }
    .warn {
      color: #92400e;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>iPhone Foto Upload (sparsam)</h1>
    <p class="hint">
      Das Bild wird vor dem Upload auf maximal <strong>1000x1000</strong> und <strong>300 KB</strong> reduziert.
    </p>

    <div class="row">
      <label for="fileInput"><strong>Foto aufnehmen oder auswählen:</strong></label>
      <input id="fileInput" type="file" accept="image/*" capture="environment">
    </div>

    <div class="row">
      <p id="status">Noch kein Bild ausgewählt.</p>
      <img id="preview" alt="Vorschau des komprimierten Bilds" hidden>
    </div>

    <div class="row">
      <button id="uploadBtn" disabled>Upload starten</button>
    </div>
  </main>

  <script>
    const MAX_WIDTH = 1000;
    const MAX_HEIGHT = 1000;
    const MAX_BYTES = 300 * 1024;
    const UPLOAD_URL = "/upload-photo"; // Auf deinen Server-Endpunkt anpassen.

    const fileInput = document.getElementById("fileInput");
    const statusEl = document.getElementById("status");
    const previewEl = document.getElementById("preview");
    const uploadBtn = document.getElementById("uploadBtn");

    let compressedBlob = null;

    function updateStatus(message, cssClass = "") {
      statusEl.textContent = message;
      statusEl.className = cssClass;
    }

    function formatKB(bytes) {
      return (bytes / 1024).toFixed(1) + " KB";
    }

    function drawScaled(image, width, height) {
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext("2d", { alpha: false });
      ctx.drawImage(image, 0, 0, width, height);
      return canvas;
    }

    function canvasToBlob(canvas, quality) {
      return new Promise((resolve, reject) => {
        canvas.toBlob((blob) => {
          if (blob) {
            resolve(blob);
          } else {
            reject(new Error("Bild konnte nicht erstellt werden."));
          }
        }, "image/jpeg", quality);
      });
    }

    async function resizeAndCompress(file) {
      const bitmap = await createImageBitmap(file);
      let scale = Math.min(MAX_WIDTH / bitmap.width, MAX_HEIGHT / bitmap.height, 1);
      let width = Math.max(1, Math.round(bitmap.width * scale));
      let height = Math.max(1, Math.round(bitmap.height * scale));

      // Mehrere Versuche: erst JPEG-Qualitaet senken, danach notfalls Dimensionen weiter reduzieren.
      for (let dimensionAttempt = 0; dimensionAttempt < 5; dimensionAttempt++) {
        const canvas = drawScaled(bitmap, width, height);

        for (let q = 0.9; q >= 0.4; q -= 0.1) {
          const blob = await canvasToBlob(canvas, Number(q.toFixed(2)));
          if (blob.size <= MAX_BYTES) {
            return { blob, width, height };
          }
        }

        width = Math.max(1, Math.round(width * 0.9));
        height = Math.max(1, Math.round(height * 0.9));
      }

      throw new Error("Bild konnte nicht unter 300 KB gebracht werden.");
    }

    fileInput.addEventListener("change", async (event) => {
      const file = event.target.files && event.target.files[0];
      uploadBtn.disabled = true;
      compressedBlob = null;
      previewEl.hidden = true;
      previewEl.src = "";

      if (!file) {
        updateStatus("Noch kein Bild ausgewählt.");
        return;
      }

      if (!file.type.startsWith("image/")) {
        updateStatus("Bitte nur Bilddateien auswählen.", "warn");
        return;
      }

      updateStatus("Bild wird verkleinert und komprimiert...");

      try {
        const result = await resizeAndCompress(file);
        compressedBlob = result.blob;

        const blobUrl = URL.createObjectURL(compressedBlob);
        previewEl.src = blobUrl;
        previewEl.hidden = false;

        updateStatus(
          "Fertig: " +
            result.width +
            "x" +
            result.height +
            ", " +
            formatKB(compressedBlob.size) +
            " (bereit zum Upload)",
          "ok"
        );

        uploadBtn.disabled = false;
      } catch (err) {
        updateStatus(err.message || "Fehler bei der Bildverarbeitung.", "warn");
      }
    });

    uploadBtn.addEventListener("click", async () => {
      if (!compressedBlob) {
        updateStatus("Kein komprimiertes Bild vorhanden.", "warn");
        return;
      }

      uploadBtn.disabled = true;
      updateStatus("Upload laeuft...");

      const formData = new FormData();
      formData.append("photo", compressedBlob, "photo-1000-max300kb.jpg");

      try {
        const response = await fetch(UPLOAD_URL, {
          method: "POST",
          body: formData
        });

        if (!response.ok) {
          throw new Error("Serverfehler: " + response.status);
        }

        updateStatus("Upload erfolgreich.", "ok");
      } catch (err) {
        updateStatus("Upload fehlgeschlagen: " + (err.message || "unbekannter Fehler"), "warn");
      } finally {
        uploadBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
